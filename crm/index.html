<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewTechIT — CRM Login</title>
  <!-- Segurança: não indexar área interna -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https: wss:;" />
  <!-- Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E30613;
      --red-dark: #b00510;
      --red-glow: rgba(227,6,19,0.25);
      --blue: #3B82F6;
      --bg-dark: #07090e;
      --bg-dark-2: #0d1117;
      --bg-card: rgba(13,17,23,0.85);
      --border: rgba(255,255,255,0.07);
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background particles canvas ── */
    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Red glow blobs ── */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-blob-1 {
      width: 500px; height: 500px;
      background: var(--red-glow);
      top: -150px; left: -150px;
      animation: blob-drift 12s ease-in-out infinite alternate;
    }
    .glow-blob-2 {
      width: 400px; height: 400px;
      background: rgba(59,130,246,0.08);
      bottom: -100px; right: -100px;
      animation: blob-drift 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes blob-drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(60px,40px) scale(1.1); }
    }

    /* ── Main card ── */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: fadeInUp 0.7s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo area ── */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 44px; height: 44px;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--red); }
    .login-tagline {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 20px;
      font-size: 11px;
      color: #10B981;
      letter-spacing: 0.03em;
    }

    /* ── Glass card ── */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 36px 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 24px 80px rgba(0,0,0,0.6),
        0 0 60px var(--red-glow);
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ── Form fields ── */
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    /* Apenas o ícone direto do campo (cadeado/email) — não afeta o botão do olho */
    .input-wrap > svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: color .2s;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px 13px 44px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:focus {
      border-color: var(--red);
      background: rgba(227,6,19,0.04);
      box-shadow: 0 0 0 3px rgba(227,6,19,0.12);
    }
    .input-wrap input:focus + svg,
    .input-wrap:focus-within > svg {
      color: var(--red);
    }
    /* password toggle */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      display: flex;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* password field icons alignment */
    .field-pw .input-wrap input {
      padding-right: 44px;
    }

    /* ── Checkbox + remember ── */
    .row-check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .check-label input[type="checkbox"] { display: none; }
    .check-box {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      background: rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color .2s, background .2s;
    }
    .check-label input:checked ~ .check-box {
      background: var(--red);
      border-color: var(--red);
    }
    .check-label input:checked ~ .check-box::after {
      content: '';
      display: block;
      width: 10px; height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
    }
    .check-text {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ── Error message ── */
    .error-msg {
      display: none;
      background: rgba(227,6,19,0.1);
      border: 1px solid rgba(227,6,19,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f87171;
      margin-bottom: 18px;
      gap: 8px;
      align-items: center;
    }
    .error-msg.show { display: flex; }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--red) 0%, #c0020e 100%);
      border: none;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(227,6,19,0.35);
    }
    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(227,6,19,0.5);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer of card ── */
    .card-footer {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .card-footer p {
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .card-footer a {
      color: var(--red);
      text-decoration: none;
      font-weight: 500;
      transition: color .2s;
    }
    .card-footer a:hover { color: #ff2231; }

    /* ── Outside footer ── */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { padding: 28px 22px 22px; border-radius: 14px; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>

  <div class="login-wrapper">

    <!-- Logo -->

      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="field">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <div class="row-check">

        <!-- Submit -->
        <button type="submit" class="btn-login" id="btnLogin">
          <span id="btnText">Entrar no Painel</span>

      </form>

      <div class="card-footer">
        <p>Precisa de acesso? <a href="https://wa.me/5511992864902?text=Olá,%20preciso%20de%20acesso%20ao%20CRM%20da%20NewTechIT" target="_blank" rel="noopener">Entre em contato via WhatsApp</a></p>
      </div>
    </div>

    <p class="login-footer">© 2025 NewTechIT — Todos os direitos reservados</p>

  <script>
    // ── Hash helper SHA-256 (puro JS — funciona em HTTP e HTTPS) ────────────
    async function sha256(str) {
      // Tenta Web Crypto API primeiro (HTTPS / localhost seguro)
      if (window.crypto && crypto.subtle) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        } catch(e) { /* cai no fallback abaixo */ }
      }
      // Fallback puro-JS (sem dependências externas)
      return sha256Pure(str);
    }

    function sha256Pure(msg) {
      function rightRotate(v,a){return(v>>>a)|(v<<(32-a));}
      const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
      const msgBytes=[...new TextEncoder().encode(msg)];
      msgBytes.push(0x80);
      while(msgBytes.length%64!==56) msgBytes.push(0);
      const bitLen=msg.length*8;
      for(let i=7;i>=0;i--) msgBytes.push((bitLen/Math.pow(2,i*8))&0xff);
      for(let i=0;i<msgBytes.length;i+=64){
        const w=[];
        for(let j=0;j<16;j++) w[j]=(msgBytes[i+j*4]<<24)|(msgBytes[i+j*4+1]<<16)|(msgBytes[i+j*4+2]<<8)|msgBytes[i+j*4+3];
        for(let j=16;j<64;j++){const s0=rightRotate(w[j-15],7)^rightRotate(w[j-15],18)^(w[j-15]>>>3);const s1=rightRotate(w[j-2],17)^rightRotate(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;}
        let[a,b,c,d,e,f,g,h]=[h0,h1,h2,h3,h4,h5,h6,h7];
        for(let j=0;j<64;j++){const S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[j]+w[j])>>>0;const S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
        h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
      }
      return [h0,h1,h2,h3,h4,h5,h6,h7].map(n=>n.toString(16).padStart(8,'0')).join('');
    }

    // ── Usuários do sistema (senhas salvas como SHA-256) ──────────────
    const USERS = [
      { email: 'admin@newtechit.com.br',
        hash: '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9',

        role: 'staff_marketing', name: 'Gestão de Mídias & Dev', avatar: 'MK' },

      { email: 'dramos@dramoscontabilidade.com.br',
        hash: '721ede0b3ff55c6e7965273c8c868043f6d79df5206fb11485281c708025fd24',

    // ── Sessão já ativa? Redireciona direto ────────────────────────────────
    (function checkAuth() {
      const auth    = localStorage.getItem('crm_auth');
      const expires = parseInt(localStorage.getItem('crm_expires') || '0', 10);
      const user    = JSON.parse(localStorage.getItem('crm_user') || 'null');
      if (auth && user && Date.now() < expires) {
        redirect(user.role);
      } else if (auth) {
        // Sessão expirada — limpa
        localStorage.removeItem('crm_auth');
        localStorage.removeItem('crm_user');
        localStorage.removeItem('crm_expires');
      }
    })();

    function redirect(role) {
      if (role === 'client') window.location.href = 'client/dashboard.html';
      else                   window.location.href = 'staff/dashboard.html';
    }

    // ── Particles ──────────────────────────────────────────────────────────
    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.5 + 0.3,
          dx: (Math.random() - 0.5) * 0.3,
          dy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.4 + 0.05
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200,210,230,${p.alpha})`;
          ctx.fill();
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > W) p.dx *= -1;
          if (p.y < 0 || p.y > H) p.dy *= -1;
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── Password toggle ──────────────────────────────────────────────────────
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    document.getElementById('togglePw').addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // ── Login form ──────────────────────────────────────────────────────────
    const form    = document.getElementById('loginForm');
    const errorEl = document.getElementById('errorMsg');
    const errorTx = document.getElementById('errorText');
    const btnLogin= document.getElementById('btnLogin');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    function showError(msg) {
      errorTx.textContent = msg;
      errorEl.classList.add('show');
    }
    function hideError() { errorEl.classList.remove('show'); }

    function setLoading(on) {
      btnLogin.disabled = on;
      btnText.style.display = on ? 'none' : '';
      spinner.style.display = on ? 'block' : 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        showError('Preencha e-mail e senha.');
        return;
      }

      setLoading(true);

      // ── Brute force protection ───────────────────────────────────────────
      const failKey   = 'crm_fails_' + email;
      const lockKey   = 'crm_lock_'  + email;
      const lockUntil = parseInt(localStorage.getItem(lockKey) || '0', 10);
      if (Date.now() < lockUntil) {
        setLoading(false);
        const mins = Math.ceil((lockUntil - Date.now()) / 60000);
        showError(`Muitas tentativas. Aguarde ${mins} minuto(s) para tentar novamente.`);
        return;
      }

      // ── Hash da senha digitada e comparação segura ───────────────────────
      const inputHash = await sha256(password);
      const customUsers = JSON.parse(localStorage.getItem('crm_users_custom') || '[]');
      const allUsers = [...USERS, ...customUsers];
      const user = allUsers.find(u => u.email === email && u.hash === inputHash);

      if (!user) {
        setLoading(false);
        const fails = parseInt(localStorage.getItem(failKey) || '0', 10) + 1;
        localStorage.setItem(failKey, String(fails));
        if (fails >= 5) {
          localStorage.setItem(lockKey, String(Date.now() + 15 * 60 * 1000));
          localStorage.removeItem(failKey);
          showError('Conta temporariamente bloqueada por 15 minutos. Muitas tentativas incorretas.');
        } else {
          showError(`E-mail ou senha incorretos. Verifique e tente novamente. (${fails}/5 tentativas)`);
        }
        document.getElementById('password').value = '';
        return;
      }

      // ── Login OK — limpa contadores e salva sessão (8h) ─────────────────
      localStorage.removeItem(failKey);
      localStorage.removeItem(lockKey);
      const session = {
        email:   user.email,
        role:    user.role,
        name:    user.name,
        avatar:  user.avatar,
        company: user.company || null
      };
      localStorage.setItem('crm_user',    JSON.stringify(session));
      localStorage.setItem('crm_auth',    crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem('crm_expires', Date.now() + 8 * 60 * 60 * 1000); // 8h
      if (remember) localStorage.setItem('crm_remember', '1');

      redirect(user.role);
    });

    // Pre-fill if remembered
    (function prefill() {
      const rem = localStorage.getItem('crm_remember');
      const u   = JSON.parse(localStorage.getItem('crm_user') || 'null');
      if (rem && u) {
        document.getElementById('email').value = u.email;
        document.getElementById('remember').checked = true;
      }
    })();
  </script>
